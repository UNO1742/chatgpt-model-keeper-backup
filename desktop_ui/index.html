<!doctype html>
<html lang="zh-CN" class="chatgpt-theme" data-codex-window-type="browser" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link id="web-style" rel="stylesheet" href="../runtime/web-ui.css"><link rel="stylesheet" href="style.css"></head><body>
<div id="orb"><canvas id="voice"></canvas><div id="orb-hit" title="点击设置 · 拖动移动 · 右键菜单"></div><span id="orb-error" hidden>!</span></div>
<main id="card" hidden>
  <header><div><span class="eyebrow">MODEL KEEPER</span><h1>额度助理</h1></div><button id="close" class="icon" aria-label="收起设置">×</button></header>
  <div class="appearance" aria-label="外观主题"><span>外观</span><div role="group" aria-label="主题选择"><button id="theme-light" aria-pressed="false">☀︎ 日间</button><button id="theme-dark" aria-pressed="true">☾ 夜间</button></div></div>
  <div class="segments" role="tablist" aria-label="预设模式"><span class="thumb" aria-hidden="true"></span><button id="tab-chat" class="selected" data-mode="chat" role="tab" aria-selected="true" aria-controls="pane-chat">聊天 <small>Chat</small></button><button id="tab-work" data-mode="work" role="tab" aria-selected="false" aria-controls="pane-work">工作 <small>Work</small></button></div>
  <div class="panes">
    <section id="pane-chat" class="pane active" data-pane="chat" role="tabpanel" aria-labelledby="tab-chat">
      <label class="toggle-row">应用聊天预设<input id="chat-enabled" type="checkbox"><span class="switch"></span></label>
      <div class="field model-field"><span id="chat-model-label">模型</span><button id="chat-model" class="model-trigger" aria-labelledby="chat-model-label chat-model-value" aria-haspopup="listbox" aria-expanded="false" aria-controls="chat-model-menu"><span id="chat-model-value"></span><span class="chevron" aria-hidden="true"></span></button><div id="chat-model-menu" class="model-menu no-drag z-50 m-px flex select-none flex-col bg-surface-elevated-secondary/90 text-default ring-(--color-border-overlay) ring-(length:--dropdown-overlay-ring-width) shadow-(--shadow-dropdown-overlay) backdrop-blur-sm rounded-2xl p-[var(--app-menu-gutter,var(--spacing))] ModelPickerDropdownContent-BBm8p1" data-state="open" role="listbox" aria-label="聊天模型" hidden></div></div>
      <div class="field reasoning"><div class="reasoning-title"><label for="chat-effort">思考程度</label></div><div id="chat-effort" role="slider" tabindex="0" aria-label="思考程度" aria-orientation="horizontal"></div><div class="rail-labels" id="chat-rail-labels"></div></div>
    </section>
    <section id="pane-work" class="pane" data-pane="work" role="tabpanel" aria-labelledby="tab-work" inert>
      <label class="toggle-row">应用工作预设<input id="work-enabled" type="checkbox"><span class="switch"></span></label>
      <div class="field model-field"><span id="work-model-label">模型</span><button id="work-model" class="model-trigger" aria-labelledby="work-model-label work-model-value" aria-haspopup="listbox" aria-expanded="false" aria-controls="work-model-menu"><span id="work-model-value"></span><span class="chevron" aria-hidden="true"></span></button><div id="work-model-menu" class="model-menu no-drag z-50 m-px flex select-none flex-col bg-surface-elevated-secondary/90 text-default ring-(--color-border-overlay) ring-(length:--dropdown-overlay-ring-width) shadow-(--shadow-dropdown-overlay) backdrop-blur-sm rounded-2xl p-[var(--app-menu-gutter,var(--spacing))] ModelPickerDropdownContent-BBm8p1" data-state="open" role="listbox" aria-label="工作模型" hidden></div></div>
      <div class="field reasoning"><div class="reasoning-title"><label for="work-effort">思考程度</label></div><div id="work-effort" role="slider" tabindex="0" aria-label="思考程度" aria-orientation="horizontal"></div><div class="rail-labels" id="work-rail-labels"></div></div>
    </section>
  </div>
  <div class="global"><label class="toggle-row">自动检测并调整<input id="enabled" type="checkbox"><span class="switch"></span></label><label class="toggle-row">登录 Windows 后启动<input id="startup" type="checkbox"><span class="switch"></span></label></div>
  <button id="save" class="primary cursor-interaction h-10 rounded-full bg-background-primary-solid text-primary-solid px-4 text-sm font-medium hover:bg-background-primary-solid-hover">保存设置</button>
  <div class="actions"><div class="action-row"><span>浏览器扩展</span><button id="extension-action" type="button" data-state="idle" aria-label="安装浏览器扩展">安装</button></div><button id="update"><span id="update-label">检查更新</span><small id="version"></small></button></div>
  <p id="status" role="status">正在连接本机程序…</p>
  <div id="guide" role="dialog" aria-modal="true" aria-label="浏览器扩展" hidden><div class="guide-title">连接到 Edge<button id="guide-close" class="icon" aria-label="关闭安装说明">×</button></div><p>自动准备扩展文件、复制路径并打开 Edge。首次加载需在浏览器中完成一次。</p><button id="prepare-extension" class="primary cursor-interaction h-10 rounded-full bg-background-primary-solid text-primary-solid px-4 text-sm font-medium hover:bg-background-primary-solid-hover">一键准备安装</button><ol><li>在打开的扩展页开启<strong>开发人员模式</strong></li><li>点击<strong>加载解压缩的扩展</strong></li><li>粘贴已复制的路径，选择文件夹；然后刷新 ChatGPT</li></ol><div class="guide-buttons"><button id="copy-path">复制路径</button><button id="open-folder">打开文件夹</button></div><p id="guide-state" role="status">本机接口已由安装程序注册，连接成功后这里会自动确认。</p></div>
</main>
<div id="toast" hidden><div class="bubble"><div class="head"><span class="mini" aria-hidden="true"></span><span class="who">额度助理</span><span class="time">刚刚</span></div><p class="main">已恢复为 <b id="toast-model">目标模型</b></p><p class="sub"><span id="toast-sub-lead">你把网页改成了 </span><s id="toast-previous"></s><span id="toast-sub-tail"></span></p></div></div>
<script src="qwebchannel.js"></script><script type="module" src="app.js"></script></body></html>
